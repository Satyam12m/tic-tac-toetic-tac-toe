<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Tic Tac Toe</h1>
        
        <div class="mode-selector">
            <button id="btn-pvp" class="mode-btn active">Player vs Player</button>
            <button id="btn-pvc" class="mode-btn">Player vs Computer</button>
        </div>
        
        <div class="scoreboard">
            <div class="player-profile active" id="profile-O">
                <img src="player 1.png" alt="Player O" class="avatar">
                <span>Player O</span>
            </div>
            
            <div class="player-profile" id="profile-X">
                <img src="player 2.webp" alt="Player X" class="avatar">
                <span id="player-x-name">Player X</span> 
            </div>
        </div>

        <p class="winning-message" id="winningMessage"></p>
        
        <div class="board">
            <div class="cell" id="0"></div>
            <div class="cell" id="1"></div>
            <div class="cell" id="2"></div>
            <div class="cell" id="3"></div>
            <div class="cell" id="4"></div>
            <div class="cell" id="5"></div>
            <div class="cell" id="6"></div>
            <div class="cell" id="7"></div>
            <div class="cell" id="8"></div>
        </div>

        <button id="restart-btn">Restart Game</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
